name: Mirror and static preview checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Prepare exact verified build tools
        run: python3 ops/bootstrap_tools.py "$RUNNER_TEMP/amber-tools"
      - name: Provision the independent systemd worker on this disposable runner
        run: bash ops/tests/provision_ci_worker.sh "$RUNNER_TEMP/amber-tools"
      - name: Verify real isolated install, build, tests and filesystem boundary
        run: python3 ops/tests/validate_sandbox.py --scratch "$RUNNER_TEMP/amber-sandbox-validation"
      - name: Show isolated test diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u amber-web-install.service -u amber-web-build.service -u amber-fetch-proxy.service -n 100 --no-pager
          sudo find /srv/amber-web-build/work -name command-failure.log -type f -exec tail -c 8000 {} \;
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test mirror, failure paths, retention and atomic rollback
        run: python -m unittest discover -s ops/tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:sites
      - run: pnpm test:mirror
      - name: Validate all local static references
        run: PYTHONPATH=ops python -c 'from pathlib import Path; from site_builder import validate_static; print(validate_static(Path("dist/client")))'
      - name: Install pinned browser test tools in disposable runner storage
        run: |
          npm install --prefix "$RUNNER_TEMP/amber-browser-tests" --ignore-scripts --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/amber-browser-tests/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Verify bilingual product and platform downloads in Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/amber-browser-tests/node_modules/playwright/index.mjs" node tests/browser-downloads.mjs
      - name: Package static preview and deployment source for review
        uses: actions/upload-artifact@v4
        with:
          name: amber-website-and-sync-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/client/
            ops/
            !ops/**/__pycache__/**
          retention-days: 14
