# INCLUDE inside the existing HTTPS server, after backing up nginx -T locally.
# Keep existing listen/server_name/TLS/Certbot/ACME configuration unchanged.
# Replace the existing root/location / definitions; do not create duplicates.
root /srv/amber-sync/public/active/current;
index index.html;
open_file_cache off;

location = /mirror/v1/index.json {
    alias /srv/amber-sync/public/mirror/index.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /mirror/v1/ {
    alias /srv/amber-sync/public/mirror/;
    autoindex off;
    gzip off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    # Browsers probe the exact immutable file with HEAD before offering it.
    # Revalidation also permits reversible withdrawal and restoration.
    add_header Cache-Control "public, max-age=300" always;
}
location ^~ /downloads/ {
    # Preserve all existing, unmanaged 1.7.4 URLs. Never moved or pruned.
    alias /var/www/html/downloads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
}
location = /index.html {
    add_header Cache-Control "no-store" always;
}
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
# Hash routes need no SPA fallback. Missing mirrors must return 404, not HTML.
# Preserve an existing ACME location; do not redirect it into this static root.
